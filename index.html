<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Controle de Gastos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    input, button {
      padding: 10px;
      margin: 5px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
    }

    .gasto {
      border: 1px solid #ddd;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .pago {
      background: #dcfce7;
    }

    .pendente {
      background: #fee2e2;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Controle de Gastos</h1>

    <h2>Cadastrar gasto</h2>
    <input id="descricao" placeholder="Descrição" />
    <input id="valor" type="number" placeholder="Valor" />
    <input id="categoria" placeholder="Categoria" />
    <button onclick="criarGasto()">Cadastrar</button>

    <h2>Resumo</h2>
    <p>Total gasto: R$ <span id="totalGasto">0</span></p>
    <p>Total pago: R$ <span id="totalPago">0</span></p>
    <p>Total pendente: R$ <span id="totalPendente">0</span></p>

    <h2>Lista de gastos</h2>
    <div id="gastos"></div>

    <div id="mensagem"></div>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
