<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Gastos</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height:100vh;
      background:
      linear-gradient(135deg,#0f172a,#1d4ed8,#2563eb);
      padding:40px;
      color:#1e293b;
    }

    .container{
      max-width:950px;
      margin:auto;
      background:rgba(255,255,255,0.96);
      border-radius:24px;
      padding:40px;
      box-shadow:
      0 20px 50px rgba(0,0,0,0.25);
    }

    h1{
      text-align:center;
      font-size:40px;
      color:#1d4ed8;
      margin-bottom:10px;
    }

    .subtitulo{
      text-align:center;
      color:#64748b;
      margin-bottom:20px;
      font-size:17px;
    }

    .version{
      width:max-content;
      margin:0 auto 35px auto;
      background:#dbeafe;
      color:#1d4ed8;
      padding:10px 18px;
      border-radius:999px;
      font-size:14px;
      font-weight:bold;
      box-shadow:
      0 5px 15px rgba(37,99,235,0.15);
    }

    .resumo{
      display:flex;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .card-resumo{
      flex:1;
      min-width:200px;
      background:#f8fafc;
      border-radius:18px;
      padding:25px;
      border-left:6px solid #2563eb;
      box-shadow:
      0 8px 20px rgba(0,0,0,0.08);
      transition:0.2s;
    }

    .card-resumo:hover{
      transform:translateY(-4px);
    }

    .card-resumo h3{
      color:#64748b;
      margin-bottom:10px;
      font-size:16px;
    }

    .card-resumo p{
      font-size:30px;
      font-weight:bold;
      color:#0f172a;
    }

    .formulario{
      display:grid;
      grid-template-columns:
      repeat(auto-fit,minmax(180px,1fr));
      gap:15px;
      margin-bottom:30px;
    }

    input{
      padding:14px;
      border:none;
      border-radius:12px;
      background:#f1f5f9;
      font-size:15px;
      outline:none;
      transition:0.2s;
    }

    input:focus{
      background:white;
      box-shadow:
      0 0 0 3px rgba(37,99,235,0.2);
    }

    button{
      border:none;
      border-radius:12px;
      padding:14px;
      background:
      linear-gradient(135deg,#2563eb,#1d4ed8);
      color:white;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      transform:translateY(-2px);
      box-shadow:
      0 10px 20px rgba(37,99,235,0.35);
    }

    .gasto{
      background:white;
      border-radius:18px;
      padding:22px;
      margin-top:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:
      0 8px 25px rgba(0,0,0,0.08);
      transition:0.2s;
    }

    .gasto:hover{
      transform:scale(1.01);
    }

    .gasto strong{
      font-size:20px;
      color:#0f172a;
    }

    .gasto p{
      margin-top:6px;
      color:#64748b;
    }

    .pago{
      border-left:6px solid #22c55e;
      background:#f0fdf4;
    }

    .pendente{
      border-left:6px solid #ef4444;
      background:#fef2f2;
    }

    .acoes{
      display:flex;
      gap:10px;
    }

    .btn-pagar{
      background:
      linear-gradient(135deg,#22c55e,#15803d);
    }

    .btn-excluir{
      background:
      linear-gradient(135deg,#ef4444,#b91c1c);
    }

    @media(max-width:700px){

      body{
        padding:15px;
      }

      .container{
        padding:25px;
      }

      h1{
        font-size:30px;
      }

      .gasto{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
      }

      .acoes{
        width:100%;
      }

      .acoes button{
        flex:1;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>💰 Controle de Gastos</h1>

    <p class="subtitulo">
      Sistema simples para gerenciamento financeiro
    </p>

    <p class="version">
      🏷️ Tag Atual: v1.0.1 - CI/CD com Vercel + Render
    </p>

  </div>

</body>
</html>
