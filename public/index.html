<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Front com Nginx e Docker</title>

  <style>
    /* MANTÉM TODO O SEU CSS AQUI IGUAL */
  </style>
</head>

<body>

  <div class="container">

    <h1>Front com Nginx e Docker</h1>

    <!-- Botão solicitado no trabalho -->
    <button onclick="chamarAPI()">
      Testar API
    </button>

    <!-- Resposta da rota /v1 -->
    <p id="resposta"></p>


    <p class="version">
      v1.0.4 - Frontend integrado ao Backend Render
    </p>



    <h2>Cadastrar gasto</h2>

    <div class="form-card">

      <div class="form-grid">

        <input 
          id="descricao" 
          placeholder="Descrição do gasto" 
        />

        <input 
          id="valor" 
          type="number" 
          placeholder="Valor em R$" 
        />

        <input 
          id="categoria" 
          placeholder="Categoria" 
        />

        <button onclick="cadastrarGasto()">
          Cadastrar
        </button>

      </div>

    </div>



    <h2>Resumo financeiro</h2>


    <div class="resumo-card">

      <div class="resumo-grid">

        <div class="resumo-item">

          <p>Total gasto</p>

          <strong>
            R$ <span id="totalGasto">0</span>
          </strong>

        </div>


        <div class="resumo-item">

          <p>Total pago</p>

          <strong>
            R$ <span id="totalPago">0</span>
          </strong>

        </div>


        <div class="resumo-item">

          <p>Total pendente</p>

          <strong>
            R$ <span id="totalPendente">0</span>
          </strong>

        </div>

      </div>

    </div>




    <h2>Lista de gastos</h2>


    <div class="lista-card">

      <div id="listaGastos"></div>

    </div>




    <footer>
      Projeto de Controle de Gastos com CI/CD, Vercel e Render
    </footer>


  </div>


  <script src="scripts.js"></script>

</body>
</html>
